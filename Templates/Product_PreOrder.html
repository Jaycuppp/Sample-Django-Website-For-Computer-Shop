{% extends "00Base.html" %}
{% block content %}

{% comment %} {% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title> Preorder </title>

    <body>

</html> {% endcomment %}
